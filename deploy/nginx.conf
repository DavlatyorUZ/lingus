log_format lingoy '$remote_addr $time_local "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
server {
 listen 80; listen [::]:80;
 server_name lingoy.uz www.lingoy.uz;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://lingoy.uz$request_uri; }
}
server {
 listen 443 ssl http2; listen [::]:443 ssl http2;
 server_name www.lingoy.uz;
 ssl_certificate /etc/letsencrypt/live/lingoy.uz/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/lingoy.uz/privkey.pem;
 return 301 https://lingoy.uz$request_uri;
}
server {
 listen 443 ssl http2; listen [::]:443 ssl http2;
 server_name lingoy.uz;
 root /srv/lingoy/current/web/dist;
 index index.html;
 ssl_certificate /etc/letsencrypt/live/lingoy.uz/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/lingoy.uz/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 client_max_body_size 5m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self'; media-src 'self' blob:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'; manifest-src 'self'" always;
 gzip on; gzip_vary on; gzip_min_length 1024;
 gzip_types application/javascript text/css application/json image/svg+xml;
 location ^~ /api/ {
  proxy_pass http://127.0.0.1:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 75s;
 }
 location ^~ /downloads/ {
  if ($uri !~ "^/downloads/(Lingoy\.apk(\.sha256)?|release\.json)$") { return 404; }
  alias /srv/lingoy/current/downloads/;
  types { application/vnd.android.package-archive apk; text/plain sha256; application/json json; }
  add_header Content-Disposition 'attachment';
  add_header X-Content-Type-Options nosniff;
  expires -1;
  autoindex off;
 }
 location = /sw.js { expires -1; }
 location = /index.html { expires -1; }
 location = / {
  if ($arg_state != "") { rewrite ^ /api/v1/auth/google/callback last; }
  if ($arg_code != "") { rewrite ^ /api/v1/auth/google/callback last; }
  if ($arg_error != "") { rewrite ^ /api/v1/auth/google/callback last; }
  try_files /index.html =404;
 }
 location /assets/ { expires 7d; try_files $uri =404; }
 location /data/ { expires 1h; try_files $uri =404; }
 location ~ /\. { deny all; }
 location / { try_files $uri $uri/ /index.html; }
 access_log /var/log/nginx/lingoy.access.log lingoy;
 error_log /var/log/nginx/lingoy.error.log warn;
}
